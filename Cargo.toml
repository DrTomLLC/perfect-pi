[package]
name = "perfect-pi"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98.1"
description = "Perfectπ — deterministic, bounded, resource-efficient Pi infrastructure for Rust."
repository = "https://github.com/DrTomLLC/perfect-pi"
readme = "README.md"
license-file = "LICENSE"
publish = false

[features]
default = []
binary16 = []
binary128 = []
all-float-formats = ["binary16", "binary128"]
complex = ["dep:num-complex"]
fixed-point = ["dep:fixed"]
decimal = ["dep:rust_decimal"]
interop = ["complex", "fixed-point", "decimal"]
runtime-generation = ["dep:num-bigint"]
arbitrary-precision = ["runtime-generation"]

[dependencies]
fixed = { version = "=1.31.0", default-features = false, optional = true }
num-complex = { version = "=0.4.6", default-features = false, optional = true }
num-bigint = { version = "=0.5.1", default-features = false, optional = true }
rust_decimal = { version = "=1.43.0", default-features = false, optional = true }

[package.metadata.perfect-pi]
status = "pre-release"
bounded_decimal_places = 40
rights = "PolyForm Noncommercial 1.0.0 community license plus separate paid commercial licensing"
