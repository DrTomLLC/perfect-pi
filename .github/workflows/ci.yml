name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatting
        run: cargo fmt --check
      - name: Production source policy
        run: python3 scripts/verify_source_policy.py
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Tests all features
        run: cargo test --all-targets --all-features
      - name: Feature isolation
        run: |
          cargo check --lib --no-default-features
          cargo check --lib --no-default-features --features binary16
          cargo check --lib --no-default-features --features binary128
          cargo check --lib --no-default-features --features all-float-formats
          cargo check --lib --no-default-features --features complex
          cargo check --lib --no-default-features --features fixed-point
          cargo check --lib --no-default-features --features decimal
          cargo check --lib --no-default-features --features interop
          cargo check --lib --no-default-features --features runtime-generation
          cargo check --lib --no-default-features --features parallel-runtime
          cargo check --lib --no-default-features --features arbitrary-precision
          cargo check --lib --no-default-features --features full
      - name: Compile-fail documentation tests
        run: cargo test --doc --all-features
      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
      - name: Independent canonical-digit verification
        run: python3 scripts/verify_reference.py
      - name: Verify generated runtime prefix
        run: python3 scripts/generate_runtime_prefix.py
      - name: Independent conversion verification
        run: python3 scripts/verify_conversions.py
      - name: Independent optional float-format verification
        run: python3 scripts/verify_float_formats.py
      - name: Independent interoperability verification
        run: python3 scripts/verify_interop.py
      - name: Independent runtime-generation verification
        run: python3 scripts/verify_runtime_generation.py
      - name: Enforce direct dependency currency/isolation
        run: python3 scripts/verify_dependency_policy.py
      - name: Enforce verification-tool currency
        run: python3 scripts/verify_verification_tool_policy.py

  current-stable:
    name: Current stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Enforce current-Rust-only policy
        run: python3 scripts/verify_rust_policy.py
      - name: Check
        run: cargo check --lib --all-features
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  current-nightly:
    name: Current nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure current nightly Rust
        run: rustup toolchain install nightly --profile minimal --component clippy
      - name: Check Perfectπ on nightly
        run: cargo +nightly check --lib --all-features
      - name: Test Perfectπ on nightly
        run: cargo +nightly test --all-targets --all-features
      - name: Verify native nightly f16/f128 against Perfectπ
        run: |
          rustc +nightly --edition=2024 verification/nightly_native_float.rs -o target/nightly-native-float
          ./target/nightly-native-float

  fuzz:
    name: Fuzz testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure current nightly Rust
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Install current cargo-fuzz
        run: cargo install cargo-fuzz --version =0.13.2 --locked
      - name: Fuzz bounded API with AddressSanitizer
        run: cargo +nightly fuzz run bounded_api --sanitizer address -- -runs=25000 -max_len=8
      - name: Fuzz interoperability with AddressSanitizer
        run: cargo +nightly fuzz run interop --sanitizer address -- -runs=25000 -max_len=8
      - name: Fuzz runtime generation with AddressSanitizer
        run: |
          rm -rf /tmp/perfect-pi-runtime-corpus
          mkdir -p /tmp/perfect-pi-runtime-corpus
          cp fuzz/seeds/runtime_generation/* /tmp/perfect-pi-runtime-corpus/
          cargo +nightly fuzz run runtime_generation /tmp/perfect-pi-runtime-corpus --sanitizer address -- -runs=10000 -max_len=5
      - name: Fuzz deep runtime arithmetic with AddressSanitizer
        run: |
          rm -rf /tmp/perfect-pi-arithmetic-corpus
          mkdir -p /tmp/perfect-pi-arithmetic-corpus
          cp fuzz/seeds/runtime_arithmetic/* /tmp/perfect-pi-arithmetic-corpus/
          cargo +nightly fuzz run runtime_arithmetic /tmp/perfect-pi-arithmetic-corpus --sanitizer address -- -runs=64 -max_len=3

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install current cargo-mutants
        run: cargo install cargo-mutants --version =27.1.0 --locked
      - name: Mutation test all production code
        run: cargo mutants --all-features --jobs 2 --timeout 45 --build-timeout 90 --no-shuffle

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools
          rustup default stable
      - name: Install current cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version =0.9.1 --locked
      - name: Enforce production coverage floor
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --summary-only \
            --fail-under-lines 92 \
            --fail-under-regions 91 \
            --fail-under-functions 100

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install current cargo-audit
        run: cargo install cargo-audit --version =0.22.2 --locked
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: RustSec advisory audit
        run: cargo audit

  host-matrix:
    name: Host ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Verify byte-for-byte cross-host reproducibility
        run: >-
          python scripts/verify_reproducibility.py
          --expect verification/reproducibility/current-stable.json

  portable-core-matrix:
    name: Core target ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv6m-none-eabi
          - thumbv7m-none-eabi
          - thumbv7em-none-eabi
          - thumbv7em-none-eabihf
          - thumbv8m.base-none-eabi
          - thumbv8m.main-none-eabi
          - riscv32imac-unknown-none-elf
          - riscv32imafc-unknown-none-elf
          - riscv64gc-unknown-none-elf
          - wasm32-unknown-unknown
          - wasm32-wasip1
          - i686-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - powerpc64-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - aarch64-linux-android
          - x86_64-linux-android
          - aarch64-apple-darwin
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-unknown-freebsd
          - x86_64-unknown-netbsd
          - x86_64-unknown-illumos
          - loongarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure current stable Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Check dependency-free core
        run: cargo check --lib --no-default-features --target ${{ matrix.target }}

  no-std-targets:
    name: no_std cross-targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure stable Rust and targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add thumbv6m-none-eabi
          rustup target add thumbv7em-none-eabihf
          rustup target add riscv32imac-unknown-none-elf
          rustup target add wasm32-unknown-unknown
          rustup target add aarch64-unknown-linux-gnu
      - name: Cortex-M0
        run: cargo check --lib --all-features --target thumbv6m-none-eabi
      - name: Cortex-M hardware-float
        run: cargo check --lib --all-features --target thumbv7em-none-eabihf
      - name: RISC-V bare metal
        run: cargo check --lib --all-features --target riscv32imac-unknown-none-elf
      - name: WebAssembly
        run: cargo check --lib --all-features --target wasm32-unknown-unknown
      - name: AArch64
        run: cargo check --lib --all-features --target aarch64-unknown-linux-gnu
      - name: Resource probes
        run: python3 scripts/measure_resources.py
